if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

source /boot/grub/config.cfg

menuentry "Hardware check - QUICK (about 15 min)" --hotkey=q {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=quick
    initrd @INITRD_LIVE@
}
menuentry "Hardware check - FULL burn-in (about 60 min)" --hotkey=f {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=full
    initrd @INITRD_LIVE@
}
if @ENABLE_MEMTEST@; then
    source /boot/grub/memtest.cfg
fi
menuentry "Hardware check - QUICK, safe graphics (black screen fix)" {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=quick nomodeset nvidia-drm.modeset=0 nvidia-current-drm.modeset=0
    initrd @INITRD_LIVE@
}
menuentry "Shell only, no tests" --hotkey=s {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=shell
    initrd @INITRD_LIVE@
}

submenu 'Other machines (different specs) ...' --hotkey=o {
    source /boot/grub/theme.cfg
    menuentry "QUICK, type the expected specs on screen" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=quick hwcheck.profile=ask
        initrd @INITRD_LIVE@
    }
    menuentry "FULL burn-in, type the expected specs on screen" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=full hwcheck.profile=ask
        initrd @INITRD_LIVE@
    }
    menuentry "QUICK, any hardware (stress tests only, no spec check)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=quick hwcheck.profile=auto
        initrd @INITRD_LIVE@
    }
    menuentry "FULL burn-in, any hardware (stress tests only, no spec check)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=full hwcheck.profile=auto
        initrd @INITRD_LIVE@
    }
}

submenu 'Developer ...' --hotkey=d {
    source /boot/grub/theme.cfg
    menuentry "Smoke test, VM profile, serial console" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=smoke hwcheck.profile=vm-test hwcheck.serial=1 console=tty0 console=ttyS0,115200
        initrd @INITRD_LIVE@
    }
    menuentry "Smoke test, any hardware, serial console" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=smoke hwcheck.profile=auto hwcheck.serial=1 console=tty0 console=ttyS0,115200
        initrd @INITRD_LIVE@
    }
    menuentry "Smoke test, specs from USB hwcheck.conf, serial console" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=smoke hwcheck.serial=1 console=tty0 console=ttyS0,115200
        initrd @INITRD_LIVE@
    }
    menuentry "Smoke test, target profile, serial console" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ hwcheck.mode=smoke hwcheck.profile=target hwcheck.serial=1 console=tty0 console=ttyS0,115200
        initrd @INITRD_LIVE@
    }
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI Firmware Settings" {
            fwsetup
        }
    fi
}
