# for another machine. Values set to 0 are not checked.
SPEC_NAME="Quadro RTX 6000 24GB / i9-10980XE 18C/36T / 128GB RAM / 2.5TB storage"

CPU_MODEL_REGEX="i9-10980XE"
CPU_CORES=18
CPU_THREADS=36
CPU_FLAGS_REQUIRED="avx2 avx512f"
CPU_TEMP_WARN_C=95

RAM_GB=128

GPU_REQUIRED=1
GPU_MODEL_REGEX="Quadro RTX 6000"
GPU_VRAM_MIB_MIN=23000
GPU_TEMP_WARN_C=88
GPU_PCIE_WIDTH_MIN=16

# Sum of all internal disks, decimal GB (a "2.5 TB" set is about 2500 GB)
DISK_TOTAL_GB_MIN=2400
